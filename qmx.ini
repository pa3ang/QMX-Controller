[DXCluster]
servers =
    	dxc.pi4cc.nl,8000
    	dxcluster.iu1bow.it,7300
    	dx1.g5gdx.com,7300
    	dxc.hamserve.uk,7300

call = ${Messages:callsign}

[DXFilters]
commands = 
    clear/spots all
    accept/spots on hf and by_zone 14,15,16


[RBNetwork]
host = telnet.reversebeacon.net
port = 7000


[Spots]
bands = 15,20,40
modes = CW,SSB
max_age = 15
europe = True


[Cloudlog]
URL = https://Your Cloudlog Root URL/
APIKey = Your API Key
StationID = 1
