[QMX]
# model : can be Low, Mid, High, Plus
model = Plus

[Serial]
# please adopt to your situation
port = COM7

[Messages]
# callsign is also used for RBN search and DX Cluster login
callsign = NOCALL

# button 1 : whatever you want with own text on the button
message_1 = R UR 55N 55N OP JOHAN 73
literal_1 = REPORT

# button 2 : whatever you want with own text on the button
message_2 = TU
literal_2 = TU

# CQ message : free to program but you can reuse given callsign with ${Messages:callsign}
cq = CQ CQ CQ DE ${Messages:callsign} ${Messages:callsign} ${Messages:callsign} K

[Memories]
# frequency in kHz, Mode
# fixed to 12 buttons exactly!!
fixed = 3630,LSB;
        7073,LSB;
        14060,CW;
        14292,USB

# variable number of memories shown in the drop down
extra = 3622,LSB;
        3692,LSB;
        5351,CW;
        5450,USB;
        5505,USB;
        6622,USB;
        7060,LSB;
        11175,USB;
        13264,USB;
        14044,CW;
        14345,USB;
        27555,USB;
        28450,USB;
        50313,DIGI;
        6640,LSB;
	 6085,AM;
	 6130,AM

[ModeColors]
# just for convenience you can change 
map = 	 LSB:orange;
        USB:orange;     
        CW:#0FF40B;
        AM:violet;
        DIGI:#0B80F4

